<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Spell Checker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #333333;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            color: #111111;
        }

        p.subtitle {
            font-size: 13px;
            color: #666666;
            margin-top: 4px;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .editor-section {
            flex: 1;
        }

        .section-title {
            font-size: 12px;
            font-weight: bold;
            color: #555555;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        /* Fixed Standard Input Area */
        textarea {
            width: 100%;
            height: 350px;
            padding: 15px;
            font-family: 'Times New Roman', Times, serif;
            font-size: 18px;
            border: 1px solid #0066cc;
            border-radius: 4px;
            outline: none;
            resize: none;
            line-height: 1.5;
            direction: ltr !important;
            text-align: left !important;
        }

        .suggestions-section {
            width: 280px;
            display: flex;
            flex-direction: column;
        }

        .suggestions-box {
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            height: 180px;
            padding: 10px;
            background-color: #fafafa;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .suggestion-item {
            padding: 8px 12px;
            margin-bottom: 4px;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            color: #0066cc;
        }

        .suggestion-item:hover {
            background-color: #0066cc;
            color: #ffffff;
        }

        .empty-state {
            color: #888888;
            font-style: italic;
            font-size: 13px;
            text-align: center;
            margin-top: 20px;
        }

        .bad-words-box {
            border: 1px solid #ffd0d0;
            background-color: #fff8f8;
            border-radius: 4px;
            padding: 10px;
            height: 155px;
            overflow-y: auto;
        }

        .bad-word-chip {
            display: inline-block;
            background: #ffe6e6;
            color: #cc0000;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            margin: 3px;
            cursor: pointer;
            border: 1px solid #ffb3b3;
            font-weight: 500;
        }

        .bad-word-chip:hover {
            background: #cc0000;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Real-time Spell Checker</h1>
        <p class="subtitle">Trie Data Structure & Levenshtein Distance Algorithm (Converted from Java Swing)</p>
    </header>

    <div class="container">
        <!-- Editor Section -->
        <div class="editor-section">
            <div class="section-title">DOCUMENT EDITOR</div>
            <textarea id="editor" placeholder="Type here... (Try typing misspelled words like rehtaf, moter, appl)"></textarea>
        </div>

        <!-- Suggestions Side Panel -->
        <div class="suggestions-section">
            <div class="section-title">MISSPELLED WORDS (CLICK TO FIX)</div>
            <div class="bad-words-box" id="badWordsBox">
                <div class="empty-state">No spelling errors detected</div>
            </div>

            <div class="section-title">SUGGESTIONS</div>
            <div class="suggestions-box" id="suggestionsBox">
                <div class="empty-state">Select a misspelled word above</div>
            </div>
        </div>
    </div>

    <script>
        // 1. Trie Data Structure
        class TrieNode {
            constructor() {
                this.children = {};
                this.isEndOfWord = false;
            }
        }

        class TrieDictionary {
            constructor() {
                this.root = new TrieNode();
            }

            insert(word) {
                let current = this.root;
                for (let ch of word.toLowerCase()) {
                    if (!current.children[ch]) {
                        current.children[ch] = new TrieNode();
                    }
                    current = current.children[ch];
                }
                current.isEndOfWord = true;
            }

            search(word) {
                let current = this.root;
                for (let ch of word.toLowerCase()) {
                    if (!current.children[ch]) return false;
                    current = current.children[ch];
                }
                return current.isEndOfWord;
            }

            getSuggestions(misspelledWord, maxDistance) {
                const suggestions = [];
                const allWords = [];
                this.collectAllWords(this.root, "", allWords);

                for (let word of allWords) {
                    if (this.computeLevenshteinDistance(misspelledWord.toLowerCase(), word) <= maxDistance) {
                        suggestions.push(word);
                    }
                }
                return suggestions;
            }

            collectAllWords(node, currentWord, result) {
                if (node.isEndOfWord) result.push(currentWord);
                for (let ch in node.children) {
                    this.collectAllWords(node.children[ch], currentWord + ch, result);
                }
            }

            computeLevenshteinDistance(str1, str2) {
                const dp = Array(str1.length + 1).fill(null).map(() => Array(str2.length + 1).fill(0));
                for (let i = 0; i <= str1.length; i++) dp[i][0] = i;
                for (let j = 0; j <= str2.length; j++) dp[0][j] = j;

                for (let i = 1; i <= str1.length; i++) {
                    for (let j = 1; j <= str2.length; j++) {
                        if (str1[i - 1] === str2[j - 1]) {
                            dp[i][j] = dp[i - 1][j - 1];
                        } else {
                            dp[i][j] = 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
                        }
                    }
                }
                return dp[str1.length][str2.length];
            }
        }

        // Initialize Dictionary with Fallback Words
        const dictionary = new TrieDictionary();
        const defaultWords = [
            "fun", "mother", "father", "matter", "brother", "sister",
            "apple", "application", "banana", "cat", "catch", "dog",
            "hello", "world", "java", "program", "programming", "algorithm",
            "structure", "object", "oriented", "microsoft", "word", "spell",
            "checker", "system", "quick", "brown", "fox", "jumps", "over",
            "lazy", "daffodil", "university", "mahim"
        ];
        defaultWords.forEach(w => dictionary.insert(w));

        // Load dictionary.txt if available
        fetch('dictionary.txt')
            .then(res => res.ok ? res.text() : Promise.reject())
            .then(text => {
                text.split(/\r?\n/).forEach(line => {
                    const w = line.trim().toLowerCase();
                    if (w) dictionary.insert(w);
                });
            }).catch(() => {});

        const editor = document.getElementById('editor');
        const badWordsBox = document.getElementById('badWordsBox');
        const suggestionsBox = document.getElementById('suggestionsBox');
        let selectedWordToFix = "";

        // Check Spelling
        function checkSpelling() {
            const text = editor.value;
            const words = text.split(/\s+/);
            const badWords = new Set();

            words.forEach(word => {
                const clean = word.replace(/[^a-zA-Z]/g, "").toLowerCase();
                if (clean.length > 0 && !dictionary.search(clean)) {
                    badWords.add(clean);
                }
            });

            if (badWords.size > 0) {
                badWordsBox.innerHTML = '';
                badWords.forEach(word => {
                    const chip = document.createElement('span');
                    chip.className = 'bad-word-chip';
                    chip.innerText = word;
                    chip.onclick = () => showSuggestions(word);
                    badWordsBox.appendChild(chip);
                });
            } else {
                badWordsBox.innerHTML = '<div class="empty-state">No spelling errors detected</div>';
                suggestionsBox.innerHTML = '<div class="empty-state">Select a misspelled word above</div>';
            }
        }

        function showSuggestions(word) {
            selectedWordToFix = word;
            const list = dictionary.getSuggestions(word, 2);
            suggestionsBox.innerHTML = '';

            if (list.length === 0) {
                suggestionsBox.innerHTML = '<div class="empty-state">No suggestions found</div>';
            } else {
                list.forEach(sug => {
                    const item = document.createElement('div');
                    item.className = 'suggestion-item';
                    item.innerText = sug;
                    item.onclick = () => replaceWord(selectedWordToFix, sug);
                    suggestionsBox.appendChild(item);
                });
            }
        }

        function replaceWord(oldWord, newWord) {
            const regex = new RegExp('\\b' + oldWord + '\\b', 'gi');
            editor.value = editor.value.replace(regex, newWord);
            checkSpelling();
            suggestionsBox.innerHTML = '<div class="empty-state">Word replaced!</div>';
        }

        editor.addEventListener('input', checkSpelling);
    </script>
</body>
</html>
